services:
  web:
    build:
      context: ./docker/services/web
      dockerfile: web.dockerfile
    working_dir: /var/www
    restart: unless-stopped
    volumes:
      - ./src:/var/www
    ports:
      - "7768:80"
    environment:
      - VIRTUAL_HOST=lpk.teman-koperasi.com
      - LETSENCRYPT_HOST=lpk.teman-koperasi.com
    networks:
      - net

networks:
  net:
    external: true
