<!DOCTYPE html>
<html>

<head>
  <!--

  <script src="https://app-prod.duitku.com/lib/js/duitku.js"></script>

  <script>
    function launchDuitkuPop(checkoutReference) {
      checkout.process(checkoutReference, {
        successEvent: function(result) {
          window.dispatchEvent(new CustomEvent('duitku_success', { detail: result }));
        },
        pendingEvent: function(result) {
          window.dispatchEvent(new CustomEvent('duitku_pending', { detail: result }));
        },
        errorEvent: function(result) {
          window.dispatchEvent(new CustomEvent('duitku_error', { detail: result }));
        },
        closeEvent: function(result) {
          window.dispatchEvent(new CustomEvent('duitku_close'));
        }
      });
    }
  </script>
  <base href="/">


  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>app</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./firebase-messaging-sw.js')
            .then((registration) => {
                console.log('Service Worker registered:', registration);
            })
            .catch((error) => {
                console.error('Service Worker registration failed:', error);
            });
    }
    </script>
    

  <script src="main.dart.js" type="application/javascript"></script>
</body>

</html>
