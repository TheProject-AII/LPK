services:
  # Web Server
  web:
    build:
      context: ./docker/services/web
      dockerfile: web.dockerfile
    working_dir: /var/www
    restart: unless-stopped
    volumes:
      - ./src:/var/www
    ports:
      - 7771:80
    environment:
      - VIRTUAL_HOST=student.teman-koperasi.com
      - LETSENCRYPT_HOST=student.teman-koperasi.com
    networks:
      - "net"
networks:
  net:
    external: true
