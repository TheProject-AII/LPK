
name: Deploy LPK (PROD/STG/DEV)

on:
  push:
    branches:
      - production
      - staging
      - development
  workflow_dispatch: {}

concurrency:
  group: deploy-lpk-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Map branch -> env + SSH creds
        id: map
        shell: bash
        run: |
          set -euo pipefail

          case "${GITHUB_REF_NAME}" in
            staging)
              echo "ENVNAME=stg" >> "$GITHUB_OUTPUT"
              echo "SSH_SRV=${{ vars.IP_STAGING }}" >> "$GITHUB_OUTPUT"
              echo "SSH_USER=${{ secrets.SSH_USER_STG }}" >> "$GITHUB_OUTPUT"
              echo "SSH_PW=${{ secrets.SSH_PW_STG }}" >> "$GITHUB_OUTPUT"
              ;;
            development)
              echo "ENVNAME=dev" >> "$GITHUB_OUTPUT"
              echo "SSH_SRV=${{ vars.IP_DEVELOPMENT }}" >> "$GITHUB_OUTPUT"
              echo "SSH_USER=${{ secrets.SSH_USER_DEV }}" >> "$GITHUB_OUTPUT"
              echo "SSH_PW=${{ secrets.SSH_PW_DEV }}" >> "$GITHUB_OUTPUT"
              ;;
            production)
              echo "ENVNAME=prod" >> "$GITHUB_OUTPUT"
              echo "SSH_SRV=${{ vars.IP_PRODUCTION }}" >> "$GITHUB_OUTPUT"
              echo "SSH_USER=${{ secrets.SSH_USER_PROD }}" >> "$GITHUB_OUTPUT"
              echo "SSH_PW=${{ secrets.SSH_PW_PROD }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac

      - name: Run restricted-git.sh on server (LPK)
        env:
          SERVER: ${{ steps.map.outputs.SSH_SRV }}
          SSH_PORT: 2011
          SSH_USER: ${{ steps.map.outputs.SSH_USER }}
          SSH_PW:   ${{ steps.map.outputs.SSH_PW }}
          ENVNAME:  ${{ steps.map.outputs.ENVNAME }} # Mengirim 'prod', 'stg', atau 'dev'
        shell: bash
        run: |
          set -euo pipefail

          echo "🚀 Starting Deployment for LPK - Environment: $ENVNAME"

          # Menjalankan script di server dengan 2 argumen:
          # Argumen 1: LPK (Nama Project)
          # Argumen 2: $ENVNAME (stg/dev/prod)
          # Ini akan mentrigger fungsi ci_mode() di dalam script shell.

          sshpass -p "$SSH_PW" ssh \
            -o StrictHostKeyChecking=no \
            -o LogLevel=ERROR \
            -p "$SSH_PORT" \
            "$SSH_USER@$SERVER" \
            "LPK $ENVNAME"

          echo "✅ Deployment finished successfully."







